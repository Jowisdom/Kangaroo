    <title>Kangaroo</title>
    <script>
        (() => {
            const themeKey = 'codex.theme.settings.v1';
            const validThemes = new Set([
                'dark-ocean',
                'dark-graphite',
                'dark-amber',
                'dark-terracotta',
                'dark-forest',
                'light-luoxiaohei',
                'light-snow',
                'light-mist',
                'light-parchment',
                'light-apricot',
                'light-garden'
            ]);

            let theme = 'dark-ocean';
            try {
                const storedTheme = window.localStorage.getItem(themeKey);
                if (validThemes.has(storedTheme)) {
                    theme = storedTheme;
                }
            } catch {
                // Keep the default theme if storage is unavailable during early boot.
            }

            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme.startsWith('light-') ? 'light' : 'dark';
        })();
    </script>

        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
            font-family: var(--ui-font-family);
            font-size: var(--ui-font-size);
            background:
                radial-gradient(circle at top left, var(--bg-orb-1), transparent 28%),
                radial-gradient(circle at top right, var(--bg-orb-2), transparent 20%),
                linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, var(--hero-overlay-1), transparent 40%),
                linear-gradient(0deg, var(--hero-overlay-2), rgba(255, 255, 255, 0));
        }

        :root[data-theme="light-luoxiaohei"] body::before {
            background:
                radial-gradient(circle at 94% 8%, rgba(143, 168, 95, 0.1), transparent 16%),
                radial-gradient(circle at 9% 92%, rgba(151, 168, 110, 0.1), transparent 18%),
                radial-gradient(circle at 78% 96%, rgba(215, 182, 106, 0.08), transparent 14%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.66), rgba(241, 246, 233, 0.18));
        }

        :root[data-theme="light-luoxiaohei"] body::after {
            display: none;
        }

        .window-titlebar-drag-region {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 34px;
            z-index: 4;
            -webkit-app-region: drag;
        }

        .toolbar-search {
            position: relative;
            flex: 0 1 420px;
            min-width: 220px;
            max-width: 460px;
        }
        .sidebar-search {
            flex: none;
            width: auto;
            min-width: 0;
            max-width: none;
        }
        .toolbar-search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--button-border);
            background: var(--panel-soft);
            color: var(--text);
            font: inherit;
            outline: none;
            box-shadow: 0 1px 0 var(--surface-sheen) inset;
        }
        .toolbar-search-input::placeholder {
            color: var(--text-muted);
        }
        .toolbar-search-input:focus {
            border-color: color-mix(in srgb, var(--accent) 60%, white 0%);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent 84%);
        }
        .toolbar-search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            display: none;
            max-height: min(52vh, 420px);
            overflow-y: auto;
            background: var(--menu-bg);
            border: 1px solid var(--button-border);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(22px);
            z-index: 5600;
            padding: 8px;
            box-sizing: border-box;
        }
        .toolbar-search-results.show {
            display: block;
        }
        .toolbar-search-summary {
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px 8px;
            margin: -8px -8px 6px;
            background: color-mix(in srgb, var(--menu-bg) 92%, transparent 8%);
            border-bottom: 1px solid color-mix(in srgb, var(--button-border) 74%, transparent 26%);
            backdrop-filter: blur(20px);
            z-index: 1;
        }
        .toolbar-search-count {
            color: var(--text);
            font-size: calc(var(--ui-font-size) - 1px);
            font-weight: 700;
        }
        .toolbar-search-hint {
            color: var(--text-muted);
            font-size: calc(var(--ui-font-size) - 3px);
        }
        .toolbar-search-empty {
            padding: 12px 14px;
            color: var(--text-muted);
            font-size: calc(var(--ui-font-size) - 2px);
            line-height: 1.6;
        }
        .toolbar-search-item {
            width: 100%;
            display: grid;
            gap: 3px;
            text-align: left;
            background: transparent;
            border: none;
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: none;
        }
        .toolbar-search-item:hover {
            background: var(--menu-hover);
            border-color: transparent;
            transform: none;
        }
        .toolbar-search-item.active {
            background: color-mix(in srgb, var(--accent) 16%, transparent 84%);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent 78%) inset;
        }
        .toolbar-search-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .toolbar-search-kind {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 8px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--accent) 16%, transparent 84%);
            color: var(--accent);
            font-size: calc(var(--ui-font-size) - 4px);
            font-weight: 700;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }
        .toolbar-search-line {
            font-size: calc(var(--ui-font-size) - 2px);
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toolbar-search-text {
            color: var(--text);
            line-height: 1.5;
            white-space: normal;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .toolbar-search-mark {
            color: var(--accent);
            font-weight: 700;
        }
        button {
            cursor: pointer;
            padding: 8px 12px;
            background: transparent;
            color: var(--text);
            border: none;
            border-radius: 0;
            transition: background 140ms ease, color 140ms ease, transform 140ms ease;
            box-shadow: none;
            outline: none;
        }

        button:hover {
            background: color-mix(in srgb, var(--sidebar-tab-active-start) 16%, transparent 84%);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.56;
            cursor: default;
        }

        input:disabled {
            opacity: 0.56;
            cursor: default;
        }

        .tab-strip {
            display: flex;
            align-items: center;
            gap: 0;
            min-height: 34px;
            padding: 7px 8px 0 10px;
            flex-shrink: 0;
            position: relative;
            z-index: 4200;
            background:
                linear-gradient(180deg,
                    var(--tab-strip-bg-start) 0%,
                    var(--tab-strip-bg-end) 100%);
            border-bottom: none;
            box-shadow: 0 1px 0 color-mix(in srgb, var(--surface-sheen) 84%, transparent 16%) inset;
            border-radius: 0;
            -webkit-app-region: drag;
        }
        .tab-strip-drag-region {
            position: absolute;
            inset: 0;
            z-index: 0;
            -webkit-app-region: drag;
        }
        .tab-strip::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 4px;
            background: var(--editor-bg-start);
            pointer-events: none;
            z-index: 6;
        }
        .editor-tabs {
            display: flex;
            align-items: center;
            gap: 0;
            min-width: 0;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0;
            scrollbar-width: none;

        .kangaroo-prosemirror .kangaroo-pdf-card.is-range-selected .kangaroo-pdf-resize-handle {

            padding: 0;
            border-radius: 0;

        .kangaroo-prosemirror blockquote {

            align-items: flex-start;

        .kangaroo-prosemirror [data-resize-container][data-node="image"] [data-resize-handle] {
            position: absolute;
            width: 14px;
            height: 14px;

        .kangaroo-prosemirror .ProseMirror-selectednode[data-resize-container][data-node="image"] [data-resize-handle],

        .kangaroo-prosemirror .ProseMirror-gapcursor {
            display: block;

            left: -1px;

        @keyframes kangaroo-gapcursor-blink {
            to {
                visibility: hidden;
            }

        .kangaroo-prosemirror ul[data-type="taskList"] {

            height: 24px;

            width: 22px;
            height: 22px;

            width: 20px;
            height: 20px;

            width: 18px;
            height: 18px;
        }

        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="6"] input[type="checkbox"] {
            width: 17px;
            height: 17px;
        }

        .kangaroo-prosemirror ul[data-type="taskList"] li[data-checked="true"] > div {
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level] > div > p {
            position: relative;

            line-height: 1.28;

        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level] > div > p::before {

            opacity: 0.7;

        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="1"] > div > p::before { content: "H1"; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="2"] > div > p::before { content: "H2"; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="3"] > div > p::before { content: "H3"; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="4"] > div > p::before { content: "H4"; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="5"] > div > p::before { content: "H5"; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="6"] > div > p::before { content: "H6"; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="1"] > div > p { font-size: 2em; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="2"] > div > p { font-size: 1.55em; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="3"] > div > p { font-size: 1.3em; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="4"] > div > p { font-size: 1.12em; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="5"] > div > p { font-size: 1em; letter-spacing: 0.01em; }
        .kangaroo-prosemirror ul[data-type="taskList"] li[data-heading-level="6"] > div > p { font-size: 0.92em; letter-spacing: 0.03em; text-transform: uppercase; }

        .wysiwyg-active-block {

            border-radius: 12px;
        }

            position: absolute;

            z-index: 999;

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border: 3px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
