        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
            font-family: var(--ui-font-family);
            font-size: var(--ui-font-size);
            background:
                radial-gradient(circle at top left, var(--bg-orb-1), transparent 28%),
                radial-gradient(circle at top right, var(--bg-orb-2), transparent 20%),
                linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, var(--hero-overlay-1), transparent 40%),
                linear-gradient(0deg, var(--hero-overlay-2), rgba(255, 255, 255, 0));
        }

        .toolbar {
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 14px 10px;
            flex-shrink: 0;
            backdrop-filter: blur(18px);
            background: var(--chrome);
            border-bottom: 1px solid var(--chrome-border);
            box-shadow: 0 1px 0 var(--surface-sheen) inset;
            position: relative;
            z-index: 5000;
        }
        .toolbar-spacer {
            flex: 1;
            min-width: 0;
        }
        .toolbar-search {
            position: relative;
            flex: 0 1 420px;
            min-width: 220px;
            max-width: 460px;
        }
        .sidebar-search {
            flex: none;
            width: auto;
            min-width: 0;
            max-width: none;
        }
        .toolbar-search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--button-border);
            background: var(--panel-soft);
            color: var(--text);
            font: inherit;
            outline: none;
            box-shadow: 0 1px 0 var(--surface-sheen) inset;
        }
        .toolbar-search-input::placeholder {
            color: var(--text-muted);
        }
        .toolbar-search-input:focus {
            border-color: color-mix(in srgb, var(--accent) 60%, white 0%);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent 84%);
        }
        .toolbar-search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            display: none;
            max-height: min(52vh, 420px);
            overflow-y: auto;
            background: var(--menu-bg);
            border: 1px solid var(--button-border);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(22px);
            z-index: 5600;
            padding: 8px;
            box-sizing: border-box;
        }
        .toolbar-search-results.show {
            display: block;
        }
        .toolbar-search-summary {
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px 8px;
            margin: -8px -8px 6px;
            background: color-mix(in srgb, var(--menu-bg) 92%, transparent 8%);
            border-bottom: 1px solid color-mix(in srgb, var(--button-border) 74%, transparent 26%);
            backdrop-filter: blur(20px);
            z-index: 1;
        }
        .toolbar-search-count {
            color: var(--text);
            font-size: calc(var(--ui-font-size) - 1px);
            font-weight: 700;
        }
        .toolbar-search-hint {
            color: var(--text-muted);
            font-size: calc(var(--ui-font-size) - 3px);
        }
        .toolbar-search-empty {
            padding: 12px 14px;
            color: var(--text-muted);
            font-size: calc(var(--ui-font-size) - 2px);
            line-height: 1.6;
        }
        .toolbar-search-item {
            width: 100%;
            display: grid;
            gap: 3px;
            text-align: left;
            background: transparent;
            border: none;
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: none;
        }
        .toolbar-search-item:hover {
            background: var(--menu-hover);
            border-color: transparent;
            transform: none;
        }
        .toolbar-search-item.active {
            background: color-mix(in srgb, var(--accent) 16%, transparent 84%);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent 78%) inset;
        }
        .toolbar-search-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .toolbar-search-kind {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 8px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--accent) 16%, transparent 84%);
            color: var(--accent);
            font-size: calc(var(--ui-font-size) - 4px);
            font-weight: 700;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }
        .toolbar-search-line {
            font-size: calc(var(--ui-font-size) - 2px);
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toolbar-search-text {
            color: var(--text);
            line-height: 1.5;
            white-space: normal;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .toolbar-search-mark {
            color: var(--accent);
            font-weight: 700;
        }
        button {
            cursor: pointer;
            padding: 8px 12px;
            background: var(--button-bg);
            color: var(--text);
            border: 1px solid var(--button-border);
            border-radius: 12px;
            transition: background 140ms ease, border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
            box-shadow: 0 1px 0 var(--surface-sheen) inset;
        }

        button:hover {
            background: var(--button-hover);
            border-color: color-mix(in srgb, var(--button-border) 72%, var(--accent) 28%);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.56;
            cursor: default;
        }

        input:disabled {
            opacity: 0.56;
            cursor: default;
        }

        .tab-strip {
            display: flex;
            align-items: center;
            gap: 0;
            min-height: 34px;
            padding: 4px 10px 0 var(--tab-strip-leading-inset, 10px);
            flex-shrink: 0;
            position: relative;
            z-index: 4200;
            background: linear-gradient(180deg, color-mix(in srgb, var(--chrome) 94%, white 6%), color-mix(in srgb, var(--chrome) 98%, transparent 2%));
            border-bottom: 1px solid color-mix(in srgb, var(--chrome-border) 56%, transparent 44%);
            box-shadow: 0 1px 0 var(--surface-sheen) inset;
            -webkit-app-region: drag;
        }
        :root[data-platform="darwin"] .tab-strip {
            --tab-strip-leading-inset: 84px;
        }
        .editor-tabs {
            display: flex;
            align-items: center;
            gap: 0;
            min-width: 0;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0;
            scrollbar-width: none;
            -webkit-app-region: drag;
        }
        .editor-tabs::-webkit-scrollbar {
            display: none;
        }
        .tab-strip-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            padding-right: 6px;
            -webkit-app-region: no-drag;
        }
        .tab-strip-add {
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--chrome-border) 76%, transparent 24%);
            background: color-mix(in srgb, var(--panel-soft) 46%, transparent 54%);
            color: var(--text);
            font-size: 18px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 0 color-mix(in srgb, white 20%, transparent 80%) inset;
            -webkit-app-region: no-drag;
        }
        .tab-strip-add:hover {
            background: color-mix(in srgb, var(--button-hover) 72%, var(--panel-soft) 28%);
        }
        .editor-tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 260px;
            flex-shrink: 0;
            min-height: 30px;
            padding: 6px 12px 6px 14px;
            border-radius: 7px 7px 0 0;
            border: 1px solid transparent;
            border-bottom: none;
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--panel-soft) 18%, transparent 82%), color-mix(in srgb, var(--panel) 58%, transparent 42%));
            color: var(--text-soft);
            box-shadow:
                0 1px 0 color-mix(in srgb, var(--surface-sheen) 80%, transparent 20%) inset,
                inset 0 -1px 0 color-mix(in srgb, var(--chrome) 92%, transparent 8%);
            position: relative;
            -webkit-app-region: no-drag;
            transition: background 140ms ease, color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
        }
        .editor-tab.drag-over-left::before,
        .editor-tab.drag-over-right::before {
            content: "";
            position: absolute;
            top: 6px;
            bottom: 6px;
            width: 3px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--accent) 78%, white 22%);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent 74%), 0 6px 18px color-mix(in srgb, var(--accent-strong) 28%, transparent 72%);
        }
        .editor-tab.drag-over-left::before {
            left: -3px;
        }
        .editor-tab.drag-over-right::before {
            right: -3px;
        }
        .editor-tab:hover {
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--panel-hover) 30%, var(--panel) 70%), color-mix(in srgb, var(--panel) 74%, transparent 26%));
            color: var(--text);
            transform: none;
        }
        .editor-tab.active {
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--panel) 62%, white 38%), color-mix(in srgb, var(--editor-bg-start) 88%, var(--panel-strong) 12%));
            border-color: color-mix(in srgb, white 12%, var(--button-border) 88%);
            color: var(--text);
            box-shadow:
                0 1px 0 var(--surface-sheen) inset,
                0 0 0 1px color-mix(in srgb, white 7%, transparent 93%) inset;
            z-index: 1;
        }
        .editor-tab-surface {
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 10px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--panel-strong) 92%, transparent 8%), color-mix(in srgb, var(--editor-bg-start) 96%, transparent 4%));
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
            opacity: 0;
            pointer-events: none;
        }
        .editor-tab.active .editor-tab-surface {
            opacity: 1;
        }
        .editor-tab-curve {
            position: absolute;
            bottom: -2px;
            width: 10px;
            height: 10px;
            opacity: 0;
            pointer-events: none;
        }
        .editor-tab.active .editor-tab-curve {
            opacity: 1;
        }
        .editor-tab-curve-left {
            left: -10px;
            border-bottom-right-radius: 10px;
            box-shadow: 5px 5px 0 0 color-mix(in srgb, var(--editor-bg-start) 96%, transparent 4%);
        }
        .editor-tab-curve-right {
            right: -10px;
            border-bottom-left-radius: 10px;
            box-shadow: -5px 5px 0 0 color-mix(in srgb, var(--editor-bg-start) 96%, transparent 4%);
        }
        .editor-tab-label {
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-weight: 560;
            letter-spacing: 0.01em;
        }
        .editor-tab-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: var(--accent-warm);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-warm) 14%, transparent 86%);
            flex-shrink: 0;
        }
        .editor-tab-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 17px;
            height: 17px;
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1;
            flex-shrink: 0;
            -webkit-app-region: no-drag;

            background: var(--modal-overlay);
            backdrop-filter: blur(18px);
            z-index: 6000;
            padding: 24px;
            box-sizing: border-box;
        }
        .settings-modal.show {
            display: flex;
        }
        .settings-card {
            width: min(460px, 100%);
            background: var(--menu-bg);
            border: 1px solid var(--button-border);
            border-radius: 22px;
            box-shadow: var(--shadow-lg);
            padding: 22px;
            box-sizing: border-box;
        }
        .settings-title {
            font-size: calc(var(--ui-font-size) + 6px);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .settings-subtitle {
            color: var(--text-muted);
            font-size: calc(var(--ui-font-size) - 1px);
            line-height: 1.6;
            margin-bottom: 18px;
        }
        .settings-group {
            display: grid;
            gap: 14px;
        }

        .settings-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .settings-tab {
            flex: 1;
            background: var(--panel-soft);
            border: 1px solid var(--button-border);
            color: var(--text-soft);
            padding: 9px 10px;
            font-size: calc(var(--ui-font-size) - 1px);
            font-weight: 600;
        }
        .settings-tab.active {
            background: linear-gradient(135deg, var(--sidebar-tab-active-start), var(--sidebar-tab-active-end));
            border-color: color-mix(in srgb, var(--accent) 45%, white 10%);
            color: var(--accent-contrast);
            box-shadow: 0 8px 22px color-mix(in srgb, var(--accent-strong) 22%, transparent 78%);
        }
        .settings-panel {
            display: none;
        }
        .settings-panel.active {
            display: grid;
        }
        .settings-field {
            display: grid;
            gap: 6px;
        }
        .settings-field label {
            font-size: calc(var(--ui-font-size) - 1px);
            color: var(--text-soft);
            font-weight: 600;
        }
        .settings-field input,
        .settings-field select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid var(--button-border);
            background: var(--panel-soft);
            color: var(--text);
            font: inherit;
            outline: none;
        }
        .settings-field input:focus,
        .settings-field select:focus {
            border-color: color-mix(in srgb, var(--accent) 70%, white 0%);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent 82%);
        }
        .settings-hint {
            color: var(--text-muted);
            font-size: calc(var(--ui-font-size) - 2px);
        }
        .settings-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        #editor-main {
            grid-row: 2;
            min-width: 0;
            min-height: 0;
            position: relative;
            display: flex;
        }
        body[data-toolbar-position="bottom"] #editor-main {
            grid-row: 1;
        }
        body[data-toolbar-position="right"] #editor-main {
            grid-column: 1;
            grid-row: 1;
        }
        #editor-container {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
            background: linear-gradient(180deg, var(--editor-bg-start), var(--editor-bg-end));
            border: 1px solid var(--button-border);
            box-shadow: var(--shadow-md);
        }

        #editor-empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
            z-index: 3;
        }

        #editor-empty-state[hidden] {
            display: none;
        }

        .editor-empty-card {
            max-width: 420px;
            padding: 22px 24px;
            border-radius: 20px;
            border: 1px solid color-mix(in srgb, var(--button-border) 80%, transparent 20%);
            background: linear-gradient(180deg, color-mix(in srgb, var(--editor-bg-start) 90%, white 10%), color-mix(in srgb, var(--editor-bg-end) 96%, transparent 4%));
            box-shadow: var(--shadow-md);
            text-align: center;
            backdrop-filter: blur(16px);
        }

        .editor-empty-title {
            font-size: calc(var(--ui-font-size) + 3px);
            font-weight: 700;
            color: var(--text);
        }

        .editor-empty-hint {
            margin-top: 8px;
            color: var(--text-soft);
            line-height: 1.5;
        }

        #preview-container {
            height: 100%;
            background: linear-gradient(180deg, var(--preview-bg-start), var(--preview-bg-end));
            color: var(--preview-text);
            padding: 38px 42px 52px;
            overflow-y: auto;
            box-sizing: border-box;
            border-radius: var(--radius-xl);
            border: 1px solid var(--preview-border);
            box-shadow: var(--shadow-lg);
            font-family: var(--preview-font-family);
            font-size: var(--preview-font-size);
            line-height: 1.32;
            position: relative;
            isolation: isolate;
        }

        #preview-container > * {
            position: relative;
            z-index: 1;
        }

        #preview-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        #preview-container::after {
            content: "";
            display: block;
            height: min(42vh, 360px);
            pointer-events: none;
        }

        #preview-container img {
            max-width: 100%;
            border-radius: 18px;
            box-shadow: 0 18px 36px var(--preview-image-shadow);
            display: block;
            margin: 22px 0;
            cursor: zoom-in;
        }

        .preview-image-resizer {
            position: relative;
            display: inline-block;
            max-width: 100%;
            vertical-align: top;
        }

        .preview-image-resizer img {
            margin: 22px 0;
        }

        .preview-image-resizer.is-selected img {
            outline: 3px solid color-mix(in srgb, var(--accent) 72%, white 8%);
            outline-offset: 4px;
        }

        .preview-image-resizer.is-resizing img {
            cursor: nwse-resize;
            user-select: none;
        }

        .preview-image-resize-handle {
            position: absolute;
            right: -10px;
            bottom: 10px;
            width: 16px;
            height: 16px;
            border: 2px solid color-mix(in srgb, var(--accent) 80%, white 0%);
            background: var(--panel-strong);
            border-radius: 999px;
            box-shadow: var(--shadow-md);
            display: none;
            cursor: nwse-resize;
            padding: 0;
        }

        .preview-image-resizer.is-selected .preview-image-resize-handle,
        .preview-image-resizer.is-resizing .preview-image-resize-handle {
            display: block;
        }

        #preview-container h1,
        #preview-container h2,
        #preview-container h3,
        #preview-container h4,
        #preview-container h5,
        #preview-container h6 {
            font-family: var(--ui-font-family);
            line-height: 1.15;
            color: var(--preview-heading);
            letter-spacing: -0.02em;
            margin-top: 1.55em;
            margin-bottom: 0.62em;
        }

        #preview-container h1 {
            font-size: 2.15em;
            margin-top: 0.1em;
        }

        #preview-container h2 {
            font-size: 1.58em;
            padding-bottom: 0.24em;
            border-bottom: 1px solid var(--preview-divider);
        }

        #preview-container h3 {
            font-size: 1.22em;
        }

        #preview-container p,
        #preview-container ul,
        #preview-container ol,
        #preview-container blockquote,
        #preview-container pre,
        #preview-container table {
            margin: 0.18em 0;
        }

        #preview-container a {
            color: var(--preview-link);
            text-decoration: none;
            border-bottom: 1px solid var(--preview-link-border);
        }

        #preview-container a:hover {
            color: var(--preview-link-hover);
            border-bottom-color: color-mix(in srgb, var(--preview-link-hover) 35%, transparent 65%);
        }

        #preview-container a.preview-entry-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.22em 0.72em;
            margin: 0.08em 0;
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--preview-link-border) 75%, transparent 25%);
            background: color-mix(in srgb, var(--preview-inline-code-bg) 72%, transparent 28%);
            text-decoration: none;
            border-bottom: none;
            line-height: 1.4;
            vertical-align: middle;
        }

        #preview-container a.preview-entry-link:hover {
            color: var(--preview-link-hover);
            border-bottom: none;
            border-color: color-mix(in srgb, var(--preview-link) 45%, transparent 55%);
            background: color-mix(in srgb, var(--preview-inline-code-bg) 55%, var(--menu-hover) 45%);
        }

        #preview-container a.preview-entry-link.preview-entry-folder {
            color: color-mix(in srgb, var(--accent-warm) 74%, var(--preview-heading) 26%);
            background: color-mix(in srgb, var(--accent-warm) 10%, var(--preview-inline-code-bg) 90%);
        }

        #preview-container a.preview-entry-link.preview-entry-file {
            color: var(--preview-link);
        }

        #preview-container a.preview-entry-link.preview-entry-missing {
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 35%, transparent 65%);
            background: color-mix(in srgb, var(--danger) 8%, var(--preview-inline-code-bg) 92%);
        }

        .preview-entry-icon {
            font-size: 0.98em;
            line-height: 1;
            flex-shrink: 0;
        }

        .preview-entry-name {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-entry-badge {
            flex-shrink: 0;
            padding: 0.12em 0.55em;
            border-radius: 999px;
            background: color-mix(in srgb, currentColor 12%, transparent 88%);
            font-family: var(--ui-font-family);
            font-size: 0.7em;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        #preview-container blockquote {
            margin-left: 0;
            padding: 0.9em 1.1em;
            border-left: 4px solid var(--preview-blockquote-border);
            background: var(--preview-blockquote-bg);
            border-radius: 0 14px 14px 0;
            color: var(--preview-blockquote-text);
        }

        #preview-container code {
            font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
            font-size: 0.9em;
            background: var(--preview-inline-code-bg);
            padding: 0.18em 0.42em;
            border-radius: 8px;
        }

        #preview-container pre {
            background: var(--preview-pre-bg);
            color: var(--preview-pre-text);
            padding: 16px 18px;
            border-radius: 16px;
            overflow: auto;
            box-shadow: inset 0 1px 0 var(--surface-sheen);
        }

        #preview-container pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        #preview-container hr {
            border: none;
            border-top: 1px solid var(--preview-divider);
            margin: 2em 0;
        }

        }

        .wysiwyg-editor-host {

            width: 100%;
            height: 100%;

            box-sizing: border-box;
            padding: 24px 24px 120px;

            line-height: var(--editor-line-height, 1.3);

            opacity: 0.72;

        .kangaroo-prosemirror {

            outline: none;
            color: var(--editor-text);

        .kangaroo-prosemirror > *:last-child {

        .kangaroo-prosemirror ol,

            vertical-align: baseline;
            border-bottom: 1px solid color-mix(in srgb, currentColor 34%, transparent 66%);

            content: none;

        .kangaroo-prosemirror a.kangaroo-link::after {
            content: none;

        .kangaroo-prosemirror a.kangaroo-link:hover {
            border-bottom-color: color-mix(in srgb, currentColor 66%, transparent 34%);

            box-shadow:

        .kangaroo-prosemirror a.kangaroo-link-link,

            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            max-width: min(34vw, 420px);
            min-width: 0;
            height: 16px;
            padding: 0 8px;
            border-radius: 8px;
            border: 1px solid var(--status-border);
            background: var(--status-bg);
            color: var(--text-soft);
            font-size: calc(var(--ui-font-size) - 4px);
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 1px 0 var(--surface-sheen) inset;
        }
    </style>
</head>
<body>
<div class="tab-strip">
    <div id="editor-tabs" class="editor-tabs"></div>
    <div class="tab-strip-actions">
        <button id="tab-add-button" class="tab-strip-add" type="button" aria-label="新建标签页">+</button>
    </div>
</div>

<div class="main-content">
        <div id="sidebar">
            <div class="sidebar-search-wrap">
                <div class="sidebar-search-row">
                    <div class="toolbar-search sidebar-search">
                        <input id="toolbar-search-input" class="toolbar-search-input" type="text" placeholder="搜索标题、正文、待办、附件">
                        <div id="toolbar-search-results" class="toolbar-search-results"></div>
                    </div>
                    <button id="toolbar-search-scope" class="sidebar-search-action toolbar-search-scope" type="button" title="当前文档搜索" aria-label="切换搜索范围">
                        <i id="toolbar-search-scope-icon" class="fa-regular fa-file-lines" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        <div class="sidebar-tabs">
            <button id="sidebar-tab-workspace" class="sidebar-tab active" type="button">目录</button>
            <button id="sidebar-tab-outline" class="sidebar-tab" type="button">大纲</button>
            <button id="sidebar-tab-todo" class="sidebar-tab" type="button">待办</button>
            <button id="sidebar-tab-attachment" class="sidebar-tab" type="button">附件</button>
        </div>
        <div id="workspace-panel" class="sidebar-panel active">
            <div id="workspace-container"></div>
        </div>
        <div id="outline-panel" class="sidebar-panel">
            <div id="outline-container"></div>
        </div>
        <div id="todo-panel" class="sidebar-panel">
            <div class="todo-controls">
                <div class="todo-controls-grid">
                    <select id="todo-scope-select">
                        <option value="document">当前文档</option>
                        <option value="workspace">整个工作空间</option>
                    </select>
                    <select id="todo-sort-select">
                        <option value="position">按出现位置</option>
                        <option value="status">按完成状态</option>
                    </select>
                </div>
                <label class="todo-filter-toggle">
                    <input id="todo-hide-completed" type="checkbox">
                    <span>隐藏已完成待办</span>
                </label>
            </div>
            <div id="todo-container"></div>
        </div>
        <div id="attachment-panel" class="sidebar-panel">
            <div id="attachment-container"></div>
        </div>
    </div>
    <div id="sidebar-resizer" title="拖拽调整侧边栏宽度"></div>
        <div id="editor-shell">
        <div class="editor-toolbar-wrap">
            <div id="editor-toolbar" class="editor-toolbar">
                <div class="editor-toolbar-group">
                    <button id="sidebar-toggle-button" class="editor-toolbar-button sidebar-toggle-button" data-tool="toggle-sidebar" type="button" title="隐藏侧边栏" aria-label="切换侧边栏">
                        <i id="sidebar-toggle-icon" class="fa-solid fa-table-columns" aria-hidden="true"></i>
                    </button>
                    <button class="editor-toolbar-button" data-tool="undo" type="button" title="撤回">
                        <span class="toolbar-glyph" aria-hidden="true"><i class="fa-solid fa-arrow-rotate-left"></i></span>
                    </button>
                    <button class="editor-toolbar-button" data-tool="redo" type="button" title="前进">
                        <span class="toolbar-glyph" aria-hidden="true"><i class="fa-solid fa-arrow-rotate-right"></i></span>
                    </button>
                </div>
                <div class="editor-toolbar-group">
                    <button class="editor-toolbar-button" data-tool="heading" data-level="1" type="button" title="一级标题 (Cmd+1)">H1</button>
                    <button class="editor-toolbar-button" data-tool="heading" data-level="2" type="button" title="二级标题 (Cmd+2)">H2</button>
                    <button class="editor-toolbar-button" data-tool="heading" data-level="3" type="button" title="三级标题 (Cmd+3)">H3</button>
                    <button class="editor-toolbar-button" data-tool="heading" data-level="4" type="button" title="四级标题 (Cmd+4)">H4</button>
                    <button class="editor-toolbar-button" data-tool="heading" data-level="5" type="button" title="五级标题 (Cmd+5)">H5</button>
                    <button class="editor-toolbar-button" data-tool="heading" data-level="6" type="button" title="六级标题 (Cmd+6)">H6</button>
                </div>
                <div class="editor-toolbar-group">
                    <button class="editor-toolbar-button" data-tool="bullet-list" type="button" title="无序列表"><span class="toolbar-glyph toolbar-glyph-list" aria-hidden="true"><i class="fa-solid fa-list"></i></span></button>
                    <button class="editor-toolbar-button" data-tool="ordered-list" type="button" title="有序列表"><span class="toolbar-glyph toolbar-glyph-list" aria-hidden="true"><i class="fa-solid fa-list-ol"></i></span></button>
                    <button class="editor-toolbar-button" data-tool="task-list" type="button" title="待办事项"><span class="toolbar-glyph toolbar-glyph-task" aria-hidden="true"><i class="fa-regular fa-square-check"></i></span></button>
                </div>
                <div class="editor-toolbar-group">
                    <button class="editor-toolbar-button" data-tool="insert-date" type="button" title="插入当前日期"><span class="toolbar-glyph toolbar-glyph-date" aria-hidden="true"><i class="fa-regular fa-calendar-days"></i></span></button>
                </div>
                <div class="editor-toolbar-group">
                    <button class="editor-toolbar-button" data-tool="bold" type="button" title="加粗"><span class="toolbar-glyph" aria-hidden="true"><i class="fa-solid fa-bold"></i></span></button>
                    <button class="editor-toolbar-button" data-tool="underline" type="button" title="下划线"><span class="toolbar-glyph" aria-hidden="true"><i class="fa-solid fa-underline"></i></span></button>
                    <button class="editor-toolbar-button" data-tool="strike" type="button" title="删除线"><span class="toolbar-glyph" aria-hidden="true"><i class="fa-solid fa-strikethrough"></i></span></button>
                </div>
            </div>
        </div>
        <div id="editor-main">
            <div id="editor-container"></div>
            <div id="editor-empty-state">
                <div class="editor-empty-card">
                    <div class="editor-empty-title">还没有打开文档</div>
                    <div class="editor-empty-hint">点击标签栏右侧的 + 新建文档，或使用 File 菜单打开 / 新建文档后再开始编辑。</div>
                </div>
            </div>
        </div>
        </div>
    <div id="preview-container">渲染中...</div>
</div>
<div class="bottom-bar">
    <div id="bundle-address" class="address-bar">未打开文档</div>
</div>
<div id="settings-modal" class="settings-modal">
    <div class="settings-card">
        <div class="settings-title">界面设置</div>
        <div class="settings-subtitle">你可以切换主题，调整界面与编辑区字体，并设置编辑区排版。</div>
        <div class="settings-group">
            <div class="settings-tabs">
                <button id="settings-tab-theme" class="settings-tab active" data-tab="theme" type="button">主题</button>
                <button id="settings-tab-font" class="settings-tab" data-tab="font" type="button">字体</button>
            </div>
            <div id="settings-panel-theme" class="settings-panel active">
                <div class="settings-field">
                    <label for="settings-theme">主题</label>
                    <select id="settings-theme">
                        <option value="dark-ocean">深色 · 夜幕蓝</option>
                        <option value="dark-graphite">深色 · 石墨灰</option>
                        <option value="dark-amber">深色 · 琥珀夜</option>
                        <option value="dark-terracotta">深色 · 赤陶橙</option>
                        <option value="dark-forest">深色 · 森林绿</option>
                        <option value="light-snow">浅色 · 雪纸白</option>
                        <option value="light-mist">浅色 · 雾青白</option>
                        <option value="light-parchment">浅色 · 米金纸</option>
                        <option value="light-apricot">浅色 · 杏桃橙</option>
                        <option value="light-garden">浅色 · 花园绿</option>
                    </select>
                </div>
            </div>
            <div id="settings-panel-font" class="settings-panel">
                <div class="settings-field">
                    <label for="settings-ui-font">界面字体</label>
                    <select id="settings-ui-font">
                        <option value="ui-system">系统默认</option>
                        <option value="ui-pingfang">苹方</option>
                        <option value="ui-rounded">圆润系统体</option>
                    </select>
                </div>
                <div class="settings-field">
                    <label for="settings-editor-font">编辑字体</label>
                    <select id="settings-editor-font">
                        <option value="editor-sfmono">SF Mono</option>
                        <option value="editor-jetbrains">JetBrains Mono</option>
                        <option value="editor-fira">Fira Code</option>
                    </select>
                </div>
                <div class="settings-field">
                    <label for="settings-ui-font-size">界面字号</label>
                    <input id="settings-ui-font-size" type="number" min="12" max="18" step="1">
                </div>
                <div class="settings-field">
                    <label for="settings-editor-font-size">编辑字号</label>
                    <input id="settings-editor-font-size" type="number" min="12" max="24" step="1">
                </div>
                <div class="settings-field">
                    <label for="settings-editor-line-height">编辑区行间距</label>
                    <input id="settings-editor-line-height" type="number" min="1" max="2" step="0.05">
                </div>
                <div class="settings-field">
                    <label for="settings-editor-paragraph-spacing">编辑区段间距</label>
                    <input id="settings-editor-paragraph-spacing" type="number" min="0" max="20" step="1">
                </div>
                <div class="settings-field">
                    <label for="settings-toolbar-position">工具栏位置</label>
                    <select id="settings-toolbar-position">
                        <option value="top">顶部</option>
                        <option value="bottom">底部</option>
                        <option value="right">右侧</option>
                    </select>
                </div>
            </div>
            <div class="settings-hint">保存后会立即生效，并记住你当前的主题、字体和编辑区排版设置。</div>
        </div>
        <div class="settings-actions">
            <button id="settings-reset-btn" type="button">恢复默认</button>
            <button id="settings-cancel-btn" type="button">取消</button>
            <button id="settings-save-btn" type="button">保存设置</button>
        </div>
    </div>
</div>
<div id="attachment-context-menu" class="attachment-context-menu">
    <button id="attachment-menu-open" type="button">打开</button>
    <button id="attachment-menu-reveal" type="button">打开所在目录</button>
    <button id="attachment-menu-rename" type="button">重命名</button>
</div>
<div id="editor-link-context-menu" class="attachment-context-menu">
    <button id="editor-link-menu-open" type="button">打开</button>
    <button id="editor-link-menu-open-with" type="button">选择应用打开</button>
    <button id="editor-link-menu-reveal" type="button">打开所在目录</button>
    <button id="editor-link-menu-rename" type="button">重命名</button>
    <button id="editor-link-menu-delete" type="button">删除</button>
</div>
<div id="preview-image-context-menu" class="preview-image-context-menu">
    <button id="preview-image-menu-copy" type="button">复制图片</button>
    <button id="preview-image-menu-reveal" type="button">打开所在目录</button>
    <button id="preview-image-menu-open-with" type="button">选择应用打开</button>
</div>
<div id="tab-context-menu" class="tab-context-menu">
    <button id="tab-menu-open-folder" type="button">打开所在目录</button>
    <button id="tab-menu-export-html" type="button">导出为 HTML 单文件</button>
</div>
<div id="workspace-context-menu" class="attachment-context-menu">
    <button id="workspace-menu-open-bundle" type="button">打开文档</button>
    <button id="workspace-menu-new-bundle" type="button">新建文档</button>
    <button id="workspace-menu-new-folder" type="button">新建文件夹</button>
    <button id="workspace-menu-rename" type="button">重命名</button>
    <button id="workspace-menu-open-folder" type="button">打开所在目录</button>
    <button id="workspace-menu-delete" type="button">删除</button>
</div>

<script>
    window.nodeRequire = require;
</script>
<script src="renderer.js"></script>
</body>
</html>
